    <script>
      // Restore clean client-side routes redirected through public/404.html on GitHub Pages.
      ;(function (location) {
        if (location.search.startsWith('?/')) {
          const route = location.search
            .slice(2)
            .split('&')
            .map(part => part.replace(/~and~/g, '&'))
            .join('?')
          window.history.replaceState(null, '', `${location.pathname}${route}${location.hash}`)
        }
